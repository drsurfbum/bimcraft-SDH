name: F28 live workspace acceptance
on:
  push:
    branches: [integration/upstream-0.7-20261025]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: f28-browser-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: devshell/vendor
          key: vendor-${{ hashFiles('devshell/vendor.json') }}
      - run: npm run fetch-vendor
      - name: Browser and independent IFC reader
        run: |
          npm install --prefix .cc-test/f28-browser-deps --no-package-lock playwright@1.56.1
          .cc-test/f28-browser-deps/node_modules/.bin/playwright install --with-deps chromium
          python -m venv .cc-test/f28-reader
          .cc-test/f28-reader/bin/python -m pip install -r tests/features/f01/requirements-independent.txt
      - name: Bounded commands and model invariants
        run: node --test tests/features/f28/*.test.mjs
      - name: Real browser acceptance
        run: node tests/features/f28/browser.mjs
      - name: Independent downloaded IFC validation
        run: .cc-test/f28-reader/bin/python -I tests/features/f28/independent.py
      - name: Same-environment F04 and F05 comparison
        run: node tests/features/f28/measure.mjs
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f28-browser
          path: |
            .cc-test/f28-browser/report.json
            evidence/f28/performance-node.json
