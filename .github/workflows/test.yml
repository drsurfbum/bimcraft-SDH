# Explicit residential baseline plus legacy oracle tests on every pull request and main push.
# Libraries are fetched by exact version and checked against devshell/vendor.json.
name: Tests

on:
  pull_request:
  push:
    branches: [candidate/f08-07-20261026, main, feature/f04-layered-plan-graphics, integration/upstream-0.7-20261025]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Baseline verifies copied-asset pins against their recorded immutable Git revision.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The PDF checks read their output back with poppler (pdftotext, pdfinfo, pdftoppm, pdfimages).
      - name: Poppler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Cache libraries
        uses: actions/cache@v4
        with:
          path: devshell/vendor
          key: vendor-${{ hashFiles('devshell/vendor.json') }}
      # --oracles: also the copyleft reference readers some checks compare against (test-only black boxes, never shipped;
      # PROVENANCE.md). Some apps' tests need them.
      - name: Standalone residential baseline
        run: npm run test:baseline
      - name: F03 harness smoke (no timing gates)
        run: npm run test:f03
      - name: Independent IFC fixture acceptance
        shell: bash
        run: |
          mkdir -p .cc-test/baseline
          python -m venv .cc-test/tools/bimcraft-test/venv
          .cc-test/tools/bimcraft-test/venv/bin/python -m pip install -r tests/features/f01/requirements-independent.txt
          node tests/features/f01/fixture.mjs --output-dir .cc-test/f01-generated
          .cc-test/tools/bimcraft-test/venv/bin/python -I tests/features/f01/independent.py fixtures/f01 .cc-test/f01-generated | tee .cc-test/baseline/independent-ifc.jsonl
          .cc-test/tools/bimcraft-test/venv/bin/python -I tests/features/f02/independent.py | tee .cc-test/baseline/f02-independent-ifc.jsonl
      - name: F04 independent drawing acceptance
        run: |
          .cc-test/tools/bimcraft-test/venv/bin/python -m pip install -r tests/features/f04/requirements-independent.txt
          .cc-test/tools/bimcraft-test/venv/bin/python -I tests/features/f04/independent-ifc.py
          .cc-test/tools/bimcraft-test/venv/bin/python -I tests/features/f04/independent-pdf.py
      - name: F05 independent IFC and vector drawing acceptance
        run: |
          .cc-test/tools/bimcraft-test/venv/bin/python -I tests/features/f05/independent.py
          .cc-test/tools/bimcraft-test/venv/bin/python -I tests/features/f05/independent-pdf.py
      - name: F06 independent schedule and export acceptance
        run: .cc-test/tools/bimcraft-test/venv/bin/python -I tests/features/f06/independent.py
      - name: npm test
        if: always()
        run: npm test -- --oracles
      - name: Residential baseline with installed readers
        if: always()
        run: |
          node --input-type=module -e "import('./devshell/baseline.mjs').then(({stages,runStages})=>{process.exitCode=runStages(stages,{reportDir:'.cc-test/baseline/readers'}).exitCode})"
      - name: Baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f01-baseline
          path: |
            .cc-test/baseline/summary.json
            .cc-test/baseline/readers/summary.json
            .cc-test/baseline/independent-ifc.jsonl
            .cc-test/baseline/f02-independent-ifc.jsonl
